[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microautoml"
version = "0.1.0"
description = "MicroAutoML-Agent: Evidence-Driven, Resource-Aware Autonomous Experimentation for Tabular Machine Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MicroAutoML Authors" }]
keywords = ["automl", "machine-learning", "tabular", "autonomous", "hyperparameter-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core scientific stack
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",

    # Sklearn ecosystem
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.11",

    # Gradient boosting
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",

    # Data validation & schemas
    "pydantic>=2.0",

    # Experiment tracking & DB
    "sqlalchemy>=2.0",

    # Resource monitoring
    "psutil>=5.9",

    # CLI
    "click>=8.1",
    "rich>=13.0",

    # Config
    "pyyaml>=6.0",

    # Plotting
    "matplotlib>=3.7",
    "seaborn>=0.12",

    # Reporting
    "jinja2>=3.1",

    # Hyperparameter optimization
    "optuna>=3.4",

    # Statistical tests
    "statsmodels>=0.14",
    
    # API client
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
advanced-models = [
    "tabpfn>=2.0",       # conditional, CPU-constrained
]
benchmark = [
    "flaml>=2.1",
    "autogluon.tabular>=1.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]

[project.scripts]
microautoml = "automl.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["automl*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
timeout = 120
