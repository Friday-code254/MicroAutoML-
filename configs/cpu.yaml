# MicroAutoML-Agent — CPU-only configuration
# For a standard 8 GB RAM / no-GPU machine
# Adjust total_ram_gb based on your actual available RAM

resource:
  total_ram_gb: 5.0           # Hard ceiling for AutoML process
  os_reserved_gb: 1.5         # Reserved for OS + background processes
  max_threads: 4              # Hard cap on OMP/MKL/n_jobs threads
  n_jobs: 2                   # Default sklearn n_jobs
  per_experiment_timeout_seconds: 300.0
  max_disk_gb: 10.0

fidelity:
  smoke_fraction: 0.08
  cheap_fraction: 0.25
  medium_fraction: 0.60
  full_fraction: 1.0
  smoke_n_estimators: 20
  cheap_n_estimators: 50
  medium_n_estimators: 150
  full_n_estimators: 300
  cheap_cv_folds: 1
  medium_cv_folds: 3
  full_cv_folds: 5

search:
  time_budget_seconds: 3600.0
  initial_explore_ratio: 0.50
  final_explore_ratio: 0.10
  exploit_adjust_delta: 0.05
  explore_adjust_delta: 0.05
  plateau_window: 5
  min_gain_threshold: 0.001
  max_repairs_per_experiment: 2
  smoke_survivors: 20
  cheap_survivors: 10
  medium_survivors: 5
  full_survivors: 3
  hpo_n_trials: 30
  hpo_timeout_seconds: 600.0
  ensemble_max_size: 5
  ensemble_diversity_threshold: 0.85

slm:
  enabled: true
  provider: ollama
  model: qwen3-4b
  api_key_env: null
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 30.0
  max_retries: 2

verbose: true
debug: false
benchmark_mode: false
random_seed: 42
